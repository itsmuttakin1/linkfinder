  <script>
    const RTDB_URL = "https://itsmuttakin-adf2b-default-rtdb.asia-southeast1.firebasedatabase.app";

    function getSlug() {
      const urlParams = new URLSearchParams(window.location.search);
      let s = urlParams.get("d") || urlParams.get("id") || urlParams.get("slug") || urlParams.get("link");
      if (s) return s.trim();

      const path = window.location.pathname;
      if (path.includes("/d/")) {
        const parts = path.split("/d/")[1].split("/")[0].split("?")[0].trim();
        if (parts && parts !== "index.html") return parts;
      }
      if (window.location.hash) {
        const h = window.location.hash.substring(1).trim();
        if (h) return h;
      }
      return null;
    }

    async function redirectDirect() {
      const slug = getSlug();
      if (!slug) {
        window.location.replace("/");
        return;
      }

      let linkData = null;

      // 1. Check SDK links
      if (typeof database !== "undefined" && database) {
        try {
          const snap = await database.ref(`links/${slug}`).once("value");
          if (snap.exists()) linkData = snap.val();
        } catch (e) {}
        if (!linkData) {
          try {
            const snap2 = await database.ref(`direct_links/${slug}`).once("value");
            if (snap2.exists()) linkData = snap2.val();
          } catch (e) {}
        }
      }

      // 2. Check REST links
      if (!linkData) {
        try {
          const resp = await fetch(`${RTDB_URL}/links/${encodeURIComponent(slug)}.json`);
          if (resp.ok) {
            const d = await resp.json();
            if (d && d.originalUrl) linkData = d;
          }
        } catch (e) {}
      }

      // 3. Check REST direct_links
      if (!linkData) {
        try {
          const resp = await fetch(`${RTDB_URL}/direct_links/${encodeURIComponent(slug)}.json`);
          if (resp.ok) {
            const d = await resp.json();
            if (d && d.originalUrl) linkData = d;
          }
        } catch (e) {}
      }

      if (!linkData || !linkData.originalUrl) {
        document.getElementById("error-box").classList.remove("hidden");
        document.getElementById("error-msg").textContent = `Direct link '${slug}' was not found or has expired.`;
        return;
      }

      // Record clicks & telemetry
      try {
        if (typeof database !== "undefined" && database) {
          database.ref(`links/${slug}/clicks`).transaction((c) => (c || 0) + 1).catch(() => {});
          database.ref(`direct_links/${slug}/clicks`).transaction((c) => (c || 0) + 1).catch(() => {});
        }
        if (typeof window.recordClickTelemetry === "function") {
          window.recordClickTelemetry(RTDB_URL, slug, "direct_link", linkData.title || linkData.originalUrl);
        }
      } catch (e) {}

      // Instant 0-second redirect
      window.location.replace(linkData.originalUrl);
    }

    window.addEventListener("DOMContentLoaded", redirectDirect);
  </script>
